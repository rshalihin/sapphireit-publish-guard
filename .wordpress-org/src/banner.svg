<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#23346b"/>
			<stop offset="1" stop-color="#0e1733"/>
		</linearGradient>
		<linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2ec95a"/>
			<stop offset="1" stop-color="#00a32a"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
		</filter>
	</defs>

	<rect width="1544" height="500" fill="url(#bg)"/>
	<!-- Soft background shapes -->
	<circle cx="1330" cy="-40" r="300" fill="#ffffff" opacity="0.04"/>
	<circle cx="1480" cy="520" r="220" fill="#ffffff" opacity="0.03"/>

	<!-- Title block (kept left and vertically centred: WP.org overlays the plugin name bottom-left) -->
	<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
		<g transform="translate(96 132)">
			<path d="M36 0 L72 13 V43 C72 66 57 83 36 91 C15 83 0 66 0 43 V13 Z" fill="url(#shield)"/>
			<path d="M19 45 L31 57 L54 33" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
		<text x="96" y="296" font-size="68" font-weight="700" fill="#ffffff">SapphireIT Publish Guard</text>
		<text x="98" y="356" font-size="32" fill="#c3cbe6">A pre-publish quality checklist</text>
		<text x="98" y="398" font-size="32" fill="#c3cbe6">for WooCommerce products.</text>
	</g>

	<!-- Checklist card -->
	<g transform="translate(1010 70)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
		<rect width="440" height="360" rx="20" fill="#ffffff" filter="url(#shadow)"/>
		<text x="32" y="56" font-size="24" font-weight="700" fill="#1d2327">Product checklist</text>
		<rect x="286" y="30" width="124" height="36" rx="18" fill="#fcf0f1"/>
		<text x="348" y="54" font-size="17" font-weight="600" fill="#d63638" text-anchor="middle">Not ready</text>
		<line x1="32" y1="86" x2="408" y2="86" stroke="#dcdcde" stroke-width="2"/>

		<!-- Pass -->
		<g transform="translate(32 110)">
			<circle cx="14" cy="14" r="14" fill="#00a32a"/>
			<path d="M8 14 L12.5 18.5 L20 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="46" y="21" font-size="20" fill="#1d2327">Title and description</text>
		</g>
		<g transform="translate(32 160)">
			<circle cx="14" cy="14" r="14" fill="#00a32a"/>
			<path d="M8 14 L12.5 18.5 L20 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="46" y="21" font-size="20" fill="#1d2327">Price is set</text>
		</g>
		<!-- Warning -->
		<g transform="translate(32 210)">
			<circle cx="14" cy="14" r="14" fill="#dba617"/>
			<rect x="12.25" y="6.5" width="3.5" height="10" rx="1.75" fill="#fff"/>
			<circle cx="14" cy="21" r="2.2" fill="#fff"/>
			<text x="46" y="21" font-size="20" fill="#1d2327">Add at least 3 images</text>
		</g>
		<!-- Fail -->
		<g transform="translate(32 260)">
			<circle cx="14" cy="14" r="14" fill="#d63638"/>
			<path d="M9 9 L19 19 M19 9 L9 19" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
			<text x="46" y="21" font-size="20" fill="#1d2327">Featured image missing</text>
		</g>
		<text x="32" y="330" font-size="17" fill="#646970">2 of 4 checks passed</text>
	</g>
</svg>
